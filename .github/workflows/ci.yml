name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit

  kit:
    name: kit build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t covenant-gateway:ci .
      - name: smoke-run the built image
        run: |
          docker run -d --name covenant-ci -p 8792:8792 \
            -e COVENANT_RPC_UPSTREAM=https://robinhood-rpc.publicnode.com \
            covenant-gateway:ci
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8792/x402/health && exit 0
            sleep 2
          done
          echo "gateway did not become healthy in time"
          docker logs covenant-ci
          exit 1
